<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi Cartilla - Historial</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<a href="index.html" style="...">Perfil</a>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1f5f56}a:hover{color:#123a34}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #f4f4f1; color: #222; font-family: system-ui, sans-serif; display: flex; flex-direction: column">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 32px; background: #ffffff; border-bottom: 2px solid #222">
<a href="index.dc.html" style="font-size: 22px; font-weight: 700; color: #222; text-decoration: none">Mi Cartilla</a>
<nav style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="index.dc.html" style="min-height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; border: 2px solid #bbbbbb; border-radius: 6px; color: #222; text-decoration: none; font-size: 15px">Perfil</a>
<a href="Estado.dc.html" style="min-height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; border: 2px solid #bbbbbb; border-radius: 6px; color: #222; text-decoration: none; font-size: 15px">Estado de vacunación</a>
<a href="Vacuna.dc.html" style="min-height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; border: 2px solid #bbbbbb; border-radius: 6px; color: #222; text-decoration: none; font-size: 15px">Información de vacunas</a>
<a href="Historial.dc.html" style="min-height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; border: 2px solid #222; border-radius: 6px; background: #222; color: #ffffff; text-decoration: none; font-size: 15px">Historial</a>
</nav>
</header>

<main style="flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; box-sizing: border-box; padding: 40px 32px; display: flex; flex-direction: column; gap: 24px">
<h1 style="margin: 0; font-size: 32px; line-height: 1.15">Historial de registros en la nube</h1>
<p style="margin: 0; font-size: 16px; color: #444">Bitácora general con todos los perfiles guardados en la base de datos global.</p>

<div style="background: #ffffff; border: 2px solid #222; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 20px">Registros en la base de datos</h2>

<div id="listaHistorial" style="display: flex; flex-direction: column; gap: 12px">
  <div style="padding: 12px; border-bottom: 1px solid #ddd; font-size: 15px">
    Cargando registros desde Supabase...
  </div>
</div>

</div>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  async componentDidMount() {
    const SUPABASE_URL = "https://eyyjohllotytsxwqofch.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_L8WrGlNuxE-Ay5SmaQfWvA_iKH1EAWP";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const contenedor = document.getElementById('listaHistorial');

    if (contenedor) {
      const { data, error } = await supabase
        .from('perfiles')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        contenedor.innerHTML = `<div style="color: #b00020; padding: 12px;">Error al cargar datos: ${error.message}</div>`;
      } else if (data && data.length > 0) {
        contenedor.innerHTML = "";
        data.forEach(persona => {
          const item = document.createElement('div');
          item.style.padding = '12px';
          item.style.borderBottom = '1px solid #ddd';
          item.style.fontSize = '15px';
          item.innerHTML = `<strong>Perfil registrado:</strong> ${persona.nombre} (${persona.relacion}), nacido(a) el ${persona.nacimiento} <br><small style="color:#666;">Guardado el: ${new Date(persona.created_at).toLocaleString()}</small>`;
          contenedor.appendChild(item);
        });
      } else {
        contenedor.innerHTML = `<div style="padding: 12px; color: #666;">No hay perfiles registrados todavía en la base de datos.</div>`;
      }
    }
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
