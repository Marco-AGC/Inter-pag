<div class="cartilla-container" style="padding: 24px; max-width: 800px; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <h2 style="color: #1f7a6d; margin-bottom: 8px;">Cartilla de Vacunación Digital</h2>
  <p style="color: #666; margin-bottom: 24px;">Estado actual de inmunización y perfil verificado.</p>

  <!-- Información General del Perfil -->
  <div id="infoPerfil" style="margin-bottom: 24px; background: #f8f9fa; padding: 20px; border-radius: 12px; border: 1px solid #e9ecef;">
    <p style="margin: 0 0 8px 0;"><strong>Nombre:</strong> <span id="nombrePerfil">-</span></p>
    <p style="margin: 0 0 8px 0;"><strong>Relación:</strong> <span id="relacionPerfil">-</span></p>
    <p id="rangoEdadPerfil" style="margin: 0; color: #1f7a6d; font-weight: bold;"></p>
  </div>

  <h3 style="margin-bottom: 16px;">Esquema de vacunación recomendado</h3>
  
  <!-- Lista de Vacunas -->
  <div class="vaccine-item" style="border: 1px solid #dee2e6; padding: 16px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; background: #fff;">
    <div>
      <strong style="font-size: 16px; color: #333;">Tétanos y Difteria (Td)</strong><br>
      <small style="color: #666;">Refuerzo cada 10 años</small>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span class="estado-vacuna-tag" style="font-size: 14px; font-weight: bold;"></span>
      <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
        <input type="checkbox" disabled style="width: 18px; height: 18px;"> Aplicada
      </label>
    </div>
  </div>

  <div class="vaccine-item" style="border: 1px solid #dee2e6; padding: 16px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; background: #fff;">
    <div>
      <strong style="font-size: 16px; color: #333;">Hepatitis B</strong><br>
      <small style="color: #666;">Esquema de 3 dosis</small>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span class="estado-vacuna-tag" style="font-size: 14px; font-weight: bold;"></span>
      <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
        <input type="checkbox" disabled style="width: 18px; height: 18px;"> Aplicada
      </label>
    </div>
  </div>

  <div class="vaccine-item" style="border: 1px solid #dee2e6; padding: 16px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; background: #fff;">
    <div>
      <strong style="font-size: 16px; color: #333;">Influenza Estacional</strong><br>
      <small style="color: #666;">Dosis anual recomendada</small>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span class="estado-vacuna-tag" style="font-size: 14px; font-weight: bold;"></span>
      <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
        <input type="checkbox" disabled style="width: 18px; height: 18px;"> Aplicada
      </label>
    </div>
  </div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  componentDidMount() {
    // 1. Recuperar el perfil validado desde el almacenamiento local
    const perfilGuardado = JSON.parse(localStorage.getItem('personaActual'));

    if (!perfilGuardado) {
      alert("No se encontró ninguna sesión activa. Por favor, realiza la búsqueda de nuevo.");
      window.location.href = "index.html";
      return;
    }

    // 2. Mostrar datos básicos en pantalla
    document.getElementById('nombrePerfil').textContent = perfilGuardado.nombre || '-';
    document.getElementById('relacionPerfil').textContent = perfilGuardado.relacion || '-';

    // 3. Calcular la edad exacta a partir de la fecha de nacimiento
    const fechaNac = new Date(perfilGuardado.nacimiento);
    const hoy = new Date();
    let edadAnios = hoy.getFullYear() - fechaNac.getFullYear();
    const mesDiff = hoy.getMonth() - fechaNac.getMonth();
    
    if (mesDiff < 0 || (mesDiff === 0 && hoy.getDate() < fechaNac.getDate())) {
      edadAnios--;
    }

    // 4. Determinar el Rango de Edad
    let rangoEdad = "";
    if (edadAnios >= 0 && edadAnios <= 9) {
      rangoEdad = "Niñas y Niños (0 a 9 años)";
    } else if (edadAnios >= 10 && edadAnios <= 19) {
      rangoEdad = "Adolescentes (10 a 19 años)";
    } else if (edadAnios >= 20 && edadAnios <= 59) {
      rangoEdad = "Adultas y Adultos (20 a 59 años)";
    } else {
      rangoEdad = "Personas Adultas Mayores (60 años o más)";
    }

    const etiquetaRango = document.getElementById("rangoEdadPerfil");
    if (etiquetaRango) {
      etiquetaRango.textContent = `Edad: ${edadAnios} años — Rango etario: ${rangoEdad}`;
    }

    // 5. Procesar las vacunas almacenadas (soporta formato JSON o texto plano)
    let vacunasLista = [];
    if (perfilGuardado.vacunas_json) {
      vacunasLista = perfilGuardado.vacunas_json;
    } else if (perfilGuardado.vacunas) {
      vacunasLista = perfilGuardado.vacunas.split(',').map(v => ({
        nombre: v.trim(),
        dosis_aplicadas: 1,
        dosis_totales: 1
      }));
    }

    // 6. Evaluar y marcar visualmente las tarjetas de vacunas
    const tarjetas = document.querySelectorAll('.vaccine-item');

    tarjetas.forEach(tarjeta => {
      const textoContenedor = tarjeta.textContent.toLowerCase();
      const checkbox = tarjeta.querySelector('input[type="checkbox"]');
      const etiquetaEstado = tarjeta.querySelector('.estado-vacuna-tag');

      const coincidencia = vacunasLista.find(item => 
        textoContenedor.includes((item.nombre || '').toLowerCase())
      );

      if (coincidencia) {
        const aplicadas = coincidencia.dosis_aplicadas ?? 1;
        const totales = coincidencia.dosis_totales ?? 1;

        if (aplicadas >= totales) {
          if (checkbox) checkbox.checked = true;
          if (etiquetaEstado) {
            etiquetaEstado.textContent = "✔ Esquema completo";
            etiquetaEstado.style.color = "#00875A";
          }
        } else if (aplicadas > 0) {
          if (checkbox) checkbox.checked = false;
          if (etiquetaEstado) {
            etiquetaEstado.textContent = `⏳ Próxima dosis (${aplicadas}/${totales})`;
            etiquetaEstado.style.color = "#b7791f";
          }
        }
      } else {
        if (checkbox) checkbox.checked = false;
        if (etiquetaEstado) {
          etiquetaEstado.textContent = "Pendiente";
          etiquetaEstado.style.color = "#e53e3e";
        }
      }
    });
  }

  renderVals() {
    return {};
  }
}
</script>
